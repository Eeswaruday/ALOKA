<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f5">

<body class="admin-login-page"><main class="login-shell">
  <a class="login-brand" href="/"><img src="/assets/aloka-logo.png" width="1005" height="915" alt="ALOKA — Intelligence Beyond Limits"></a>
  <section class="login-card"><p class="admin-kicker">PRIVATE WORKSPACE</p><h1>Admin sign in</h1><p class="login-intro">Sign in to manage <span class="brand-name">ALOKA</span>'s experiment library.</p><p class="notice" id="login-notice" role="status" aria-live="polite" hidden></p>
    <form id="login-form"><label for="admin-email">Email or username</label><input id="admin-email" name="email" type="email" autocomplete="username" required><label for="admin-password">Password</label><div class="password-field"><input id="admin-password" name="password" type="password" autocomplete="current-password" required><button id="toggle-password" type="button" aria-label="Show password" aria-pressed="false">Show</button></div><button class="admin-primary" id="login-submit" type="submit"><span>Sign in</span><span class="spinner" aria-hidden="true"></span></button></form>
    <p class="login-foot">Admin access is managed privately by the site owner.</p>
  </section><footer>ALOKA · INTELLIGENCE BEYOND LIMITS</footer>
</main></body></html>
